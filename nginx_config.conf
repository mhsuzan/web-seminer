# Nginx configuration for seminar.codinzy.com
# Place this file in /etc/nginx/sites-available/seminar.codinzy.com
# Then create a symlink: sudo ln -s /etc/nginx/sites-available/seminar.codinzy.com /etc/nginx/sites-enabled/
# Test: sudo nginx -t
# Reload: sudo systemctl reload nginx

# HTTP server - redirect to HTTPS
server {
    listen 80;
    server_name seminar.codinzy.com;
    
    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name seminar.codinzy.com;

    # SSL certificate paths
    ssl_certificate /etc/letsencrypt/live/seminar.codinzy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seminar.codinzy.com/privkey.pem;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Static files
    location /static/ {
        alias /root/seminer/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Increase timeouts for large requests
    proxy_connect_timeout 120s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
}
